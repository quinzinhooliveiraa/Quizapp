openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Perguntas de Conexão API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: questions
    description: Relationship question content
  - name: access
    description: Buyer and guest access
  - name: preferences
    description: Relationship preferences
  - name: checkout
    description: External checkout webhook
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /questions/themes:
    get:
      operationId: listQuestionThemes
      tags: [questions]
      summary: List question themes
      responses:
        "200":
          description: Available question themes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestionTheme"
  /questions:
    get:
      operationId: listQuestions
      tags: [questions]
      summary: List questions for a theme
      parameters:
        - name: theme
          in: query
          required: false
          schema:
            type: string
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [relationship, family, friends]
      responses:
        "200":
          description: Questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Question"
  /access/preview:
    get:
      operationId: getAccessPreview
      tags: [access]
      summary: Return the current demo access state
      responses:
        "200":
          description: Access preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessState"
  /access/check-email:
    get:
      operationId: checkAccessEmail
      tags: [access]
      summary: Check whether an email already belongs to an active access
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email access status
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
                  asOwner:
                    type: boolean
                  asGuest:
                    type: boolean
                required: [exists, asOwner, asGuest]
        "400":
          description: Invalid email
  /access/sessions:
    post:
      operationId: createQuestionSession
      tags: [access]
      summary: Create a buyer question session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSession"
  /preferences:
    get:
      operationId: getPreferences
      tags: [preferences]
      summary: Get relationship preferences
      parameters:
        - name: sessionId
          in: query
          required: false
          schema:
            type: string
        - name: guestToken
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Relationship preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "400":
          description: An owner session or guest token is required
        "404":
          description: Session or invite not found
    patch:
      operationId: updatePreferences
      tags: [preferences]
      summary: Update relationship preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesInput"
      responses:
        "200":
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid preferences
  /access/sessions/{sessionId}:
    get:
      operationId: getQuestionSession
      tags: [access]
      summary: Get a question session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Question session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSession"
        "404":
          description: Session not found
  /access/sessions/{sessionId}/complete-onboarding:
    post:
      operationId: completeOwnerOnboarding
      tags: [access]
      summary: Mark owner onboarding as complete
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Onboarding marked complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
  /access/sessions/{sessionId}/reset-onboarding:
    post:
      operationId: resetOwnerOnboarding
      tags: [access]
      summary: Reset owner onboarding
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Onboarding reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
  /access/sessions/{sessionId}/invites:
    get:
      operationId: listInvites
      tags: [access]
      summary: List guest invites for a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Guest invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InviteListItem"
    post:
      operationId: createInvite
      tags: [access]
      summary: Create a guest invite
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "409":
          description: Invite limit reached
  /access/invites/{token}:
    get:
      operationId: getInvite
      tags: [access]
      summary: Resolve a guest invite
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Guest invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestAccess"
        "404":
          description: Invite not found
  /access/invites/{token}/accept:
    post:
      operationId: acceptInvite
      tags: [access]
      summary: Accept a guest invite
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteAccepted"
        "404":
          description: Invite not found
  /access/invites/{token}/complete-onboarding:
    post:
      operationId: completeGuestOnboarding
      tags: [access]
      summary: Mark guest onboarding as complete
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Onboarding marked complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
  /access/invites/{token}/reset-onboarding:
    post:
      operationId: resetGuestOnboarding
      tags: [access]
      summary: Reset guest onboarding
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Onboarding reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
  /access/sessions/{sessionId}/invites/{token}:
    delete:
      operationId: cancelInvite
      tags: [access]
      summary: Cancel a guest invite
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
  /checkout/webhook:
    post:
      operationId: receiveCheckoutWebhook
      tags: [checkout]
      summary: Receive a one-time checkout confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutWebhook"
      responses:
        "200":
          description: Webhook accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResult"
  /checkout/create:
    post:
      operationId: createCheckout
      tags: [checkout]
      summary: Create an Abacate Pay checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutCreateInput"
      responses:
        "201":
          description: Checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutCreateResponse"
        "400":
          description: Invalid checkout data
        "502":
          description: Payment provider unavailable
  /checkout/abacatepay-webhook:
    post:
      operationId: receiveAbacatePayWebhook
      tags: [checkout]
      summary: Receive an authenticated Abacate Pay completion webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbacatePayWebhook"
      responses:
        "200":
          description: Webhook accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacatePayWebhookResult"
        "401":
          description: Invalid webhook signature
  /track/page-event:
    post:
      operationId: trackPageEvent
      tags: [tracking]
      summary: Record an anonymous landing page event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageEventInput"
      responses:
        "204":
          description: Event recorded
        "400":
          description: Invalid event
  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      summary: Get landing page analytics
      parameters:
        - name: sessionId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Analytics for each landing page
          content:
            application/json:
              schema:
                type: object
                properties:
                  analytics:
                    type: array
                    items:
                      $ref: "#/components/schemas/LandingAnalytics"
                required: [analytics]
        "403":
          description: Access denied
  /suggestions:
    post:
      operationId: createSuggestion
      tags: [feedback]
      summary: Submit a suggestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestionInput"
      responses:
        "201":
          description: Suggestion received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suggestion"
        "400":
          description: Invalid suggestion
  /reviews:
    get:
      operationId: listPublicReviews
      tags: [feedback]
      summary: List a small set of published reviews for checkout reassurance
      responses:
        "200":
          description: Published reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: "#/components/schemas/Review"
                required: [reviews]
    post:
      operationId: createReview
      tags: [feedback]
      summary: Submit a review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Review received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: Invalid review
  /admin/suggestions:
    get:
      operationId: listAdminSuggestions
      tags: [feedback]
      summary: List submitted suggestions for an administrator
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Submitted suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Suggestion"
                required: [suggestions]
        "403":
          description: Access denied
  /admin/reviews:
    get:
      operationId: listAdminReviews
      tags: [feedback]
      summary: List submitted reviews for an administrator
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Submitted reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items:
                      $ref: "#/components/schemas/Review"
                required: [reviews]
        "403":
          description: Access denied
  /admin/buyers:
    get:
      operationId: listAdminBuyers
      tags: [feedback]
      summary: List registered buyers for an administrator
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Registered buyers and totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  buyers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Buyer"
                  total: { type: number }
                  totalWithAccess: { type: number }
                required: [buyers, total, totalWithAccess]
        "403":
          description: Access denied
  /admin/buyers/{buyerId}:
    delete:
      operationId: deleteAdminBuyer
      tags: [admin]
      summary: Delete a buyer registration
      parameters:
        - name: buyerId
          in: path
          required: true
          schema: { type: string }
        - name: sessionId
          in: query
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Buyer deleted
        "403":
          description: Access denied
        "404":
          description: Buyer not found
  /admin/session-recording:
    get:
      operationId: getAdminSessionRecording
      tags: [admin]
      summary: Find a Clarity session recording for a buyer
      parameters:
        - name: sessionId
          in: query
          required: true
          schema: { type: string }
        - name: buyerId
          in: query
          required: false
          schema: { type: string }
        - name: visitorKey
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Recording lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRecordingLookup"
        "403":
          description: Access denied
  /admin/lp-sessions:
    get:
      operationId: listAdminLpSessions
      tags: [admin]
      summary: List recent sessions for a landing page
      parameters:
        - name: sessionId
          in: query
          required: true
          schema: { type: string }
        - name: lpId
          in: query
          required: true
          schema:
            type: string
            enum: [v1, v2]
      responses:
        "200":
          description: Recent landing page sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/LandingSession"
                required: [sessions]
        "403":
          description: Access denied
  /push/vapid-public-key:
    get:
      operationId: getPushVapidPublicKey
      tags: [admin]
      summary: Return the public key used by Web Push
      responses:
        "200":
          description: VAPID public key
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicKey: { type: string }
                required: [publicKey]
        "503":
          description: Push notifications are not configured
  /admin/push-subscribe:
    post:
      operationId: subscribeAdminPush
      tags: [admin]
      summary: Register an administrator device for push notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId: { type: string }
                subscription:
                  type: object
                  properties:
                    endpoint: { type: string }
                    keys:
                      type: object
                      properties:
                        p256dh: { type: string }
                        auth: { type: string }
                      required: [p256dh, auth]
                  required: [endpoint, keys]
              required: [sessionId, subscription]
      responses:
        "201":
          description: Subscription registered
        "400":
          description: Invalid subscription
        "403":
          description: Access denied
  /admin/push-unsubscribe:
    post:
      operationId: unsubscribeAdminPush
      tags: [admin]
      summary: Remove an administrator device from push notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId: { type: string }
                endpoint: { type: string }
              required: [sessionId, endpoint]
      responses:
        "200":
          description: Subscription removed
        "400":
          description: Invalid endpoint
        "403":
          description: Access denied
components:
  schemas:
    Suggestion:
      type: object
      properties:
        id: { type: string }
        email: { type: ["string", "null"] }
        message: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, email, message, createdAt]
    SuggestionInput:
      type: object
      properties:
        email: { type: string, maxLength: 200 }
        message: { type: string, minLength: 1, maxLength: 2000 }
      required: [message]
    Review:
      type: object
      properties:
        id: { type: string }
        displayName: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        rating: { type: number, minimum: 1, maximum: 5 }
        message: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, displayName, email, rating, message, createdAt]
    ReviewInput:
      type: object
      properties:
        displayName: { type: string, maxLength: 80 }
        email: { type: string, maxLength: 200 }
        rating: { type: number, minimum: 1, maximum: 5 }
        message: { type: string, minLength: 1, maxLength: 2000 }
      required: [rating, message]
    Buyer:
      type: object
      properties:
        id: { type: string }
        buyerName: { type: string }
        buyerEmail: { type: ["string", "null"] }
        packageName: { type: string }
        accessGranted: { type: boolean }
        invitesUsed: { type: number }
        inviteLimit: { type: number }
        createdAt: { type: string, format: date-time }
      required:
        [
          id,
          buyerName,
          buyerEmail,
          packageName,
          accessGranted,
          invitesUsed,
          inviteLimit,
          createdAt,
        ]
    LandingSession:
      type: object
      properties:
        visitorKey: { type: string }
        firstSeenAt: { type: string, format: date-time }
        timeOnPageSeconds: { type: ["number", "null"] }
        lastSection: { type: ["string", "null"] }
        status:
          type: string
          enum: [comprou, aguardando_pagamento, so_visitou]
        buyerName: { type: ["string", "null"] }
        packageName: { type: ["string", "null"] }
        hasRecording: { type: boolean }
      required:
        [
          visitorKey,
          firstSeenAt,
          timeOnPageSeconds,
          lastSection,
          status,
          buyerName,
          packageName,
          hasRecording,
        ]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    QuestionTheme:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        count:
          type: number
        audience:
          type: string
          enum: [todos, casais, "18+"]
        kind:
          type: string
          enum: [tema, vibe]
      required: [id, title, description, count, audience, kind]
    Question:
      type: object
      properties:
        id:
          type: string
        themeId:
          type: string
        text:
          type: string
        intensity:
          type: string
          enum: [gentle, honest, deep]
      required: [id, themeId, text, intensity]
    AccessState:
      type: object
      properties:
        role:
          type: string
          enum: [buyer, guest, visitor]
        hasAccess:
          type: boolean
        canInvite:
          type: boolean
        packageName:
          type: ["string", "null"]
        invitesUsed:
          type: number
        invitesLimit:
          type: number
      required:
        [role, hasAccess, canInvite, packageName, invitesUsed, invitesLimit]
    SessionInput:
      type: object
      properties:
        buyerName:
          type: string
          minLength: 1
        packageId:
          type: string
          enum: [couple, family]
      required: [buyerName, packageId]
    QuestionSession:
      type: object
      properties:
        id:
          type: string
        buyerName:
          type: string
        packageId:
          type: string
        packageName:
          type: string
        inviteLimit:
          type: number
        invitesUsed:
          type: number
        accessGranted:
          type: boolean
        onboardingComplete:
          type: boolean
      required:
        [
          id,
          buyerName,
          packageId,
          packageName,
          inviteLimit,
          invitesUsed,
          accessGranted,
          onboardingComplete,
        ]
    Preferences:
      type: object
      properties:
        relationshipType:
          type: ["string", "null"]
        partnerPronoun:
          type: ["string", "null"]
      required: [relationshipType, partnerPronoun]
    PreferencesInput:
      type: object
      properties:
        sessionId:
          type: string
        guestToken:
          type: string
        relationshipType:
          type: string
          maxLength: 80
        partnerPronoun:
          type: string
          maxLength: 40
      minProperties: 1
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
    InviteInput:
      type: object
      properties:
        guestName:
          type: string
          minLength: 1
      required: [guestName]
    Invite:
      type: object
      properties:
        token:
          type: string
        guestName:
          type: string
      required: [token, guestName]
    InviteListItem:
      type: object
      properties:
        token:
          type: string
        guestName:
          type: string
        isUsed:
          type: boolean
        usedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [token, guestName, isUsed, usedAt, createdAt]
    InviteAccepted:
      type: object
      properties:
        accepted:
          type: boolean
      required: [accepted]
    GuestAccess:
      type: object
      properties:
        role:
          type: string
          enum: [guest]
        hasAccess:
          type: boolean
        canInvite:
          type: boolean
        guestName:
          type: string
        packageName:
          type: string
        ownerName:
          type: string
        onboardingComplete:
          type: boolean
      required:
        [
          role,
          hasAccess,
          canInvite,
          guestName,
          packageName,
          ownerName,
          onboardingComplete,
        ]
    CheckoutWebhook:
      type: object
      properties:
        eventId:
          type: string
        eventType:
          type: string
          enum: [payment.completed]
        buyerEmail:
          type: string
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
        buyerName:
          type: string
        packageId:
          type: string
          enum: [couple, family]
        paymentReference:
          type: string
      required:
        [eventId, eventType, buyerEmail, buyerName, packageId, paymentReference]
    WebhookResult:
      type: object
      properties:
        accepted:
          type: boolean
        accessId:
          type: string
        message:
          type: string
      required: [accepted, accessId, message]
    CheckoutCreateInput:
      type: object
      properties:
        packageId:
          type: string
          enum: [couple]
        buyerName:
          type: string
          minLength: 1
        mode:
          type: string
          enum: [native, hosted]
        buyerEmail:
          type: string
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
        sourceLp:
          type: string
          enum: [v1, v2]
        visitorKey:
          type: string
          minLength: 1
          maxLength: 120
      required: [packageId, buyerName]
    PageEventInput:
      type: object
      properties:
        lpId: { type: string, enum: [v1, v2] }
        visitorKey: { type: string, minLength: 1, maxLength: 120 }
        eventType: { type: string, enum: [view, cta_click, exit] }
        timeOnPageMs: { type: number, minimum: 0 }
        lastSection: { type: string, maxLength: 80 }
        clarityUserId: { type: string, maxLength: 200 }
        claritySessionId: { type: string, maxLength: 200 }
      required: [lpId, visitorKey, eventType]
    SessionRecordingLookup:
      type: object
      properties:
        available: { type: boolean }
        url: { type: string }
        visitorKey: { type: string }
        reason:
          type: string
          enum: [sem-rastreio, sem-gravacao]
      required: [available]
    LandingAnalytics:
      type: object
      properties:
        lpId: { type: string, enum: [v1, v2] }
        views: { type: number }
        ctaClicks: { type: number }
        checkoutsStarted: { type: number }
        purchasesConfirmed: { type: number }
        avgTimeOnPageSeconds: { type: ["number", "null"] }
        topExitSections:
          type: array
          items:
            type: object
            properties:
              section: { type: string }
              count: { type: number }
            required: [section, count]
      required:
        [
          lpId,
          views,
          ctaClicks,
          checkoutsStarted,
          purchasesConfirmed,
          avgTimeOnPageSeconds,
          topExitSections,
        ]
    CheckoutCreateResponse:
      type: object
      properties:
        sessionId:
          type: string
        checkoutUrl:
          type: string
        billId:
          type: string
        brCode:
          type: string
        brCodeBase64:
          type: string
        chargeId:
          type: string
      required: [sessionId]
    AbacatePayWebhook:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        event:
          type: string
        data:
          type: object
          additionalProperties: true
          properties:
            id:
              type: string
            externalId:
              type: string
            metadata:
              type: object
              additionalProperties: true
              properties:
                sessionId:
                  type: string
                externalId:
                  type: string
      required: [event, data]
    AbacatePayWebhookResult:
      type: object
      properties:
        accepted:
          type: boolean
        message:
          type: string
      required: [accepted, message]
